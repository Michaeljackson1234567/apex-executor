<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Apex Executor</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{width:100vw;height:100vh;background:#050507;font-family:'Inter',sans-serif;overflow:hidden;display:flex;align-items:center;justify-content:center}

    .bg-particles{position:fixed;inset:0;pointer-events:none;z-index:0}
    .particle{position:absolute;width:2px;height:2px;background:rgba(255,255,255,.15);border-radius:50%;animation:drift linear infinite}
    @keyframes drift{0%{transform:translateY(100vh) scale(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateY(-10vh) scale(1);opacity:0}}

    .glow-1{position:fixed;top:20%;left:30%;width:300px;height:300px;background:radial-gradient(circle,rgba(139,92,246,.06) 0%,transparent 70%);animation:orb1 8s ease-in-out infinite;pointer-events:none}
    .glow-2{position:fixed;bottom:20%;right:25%;width:250px;height:250px;background:radial-gradient(circle,rgba(59,130,246,.05) 0%,transparent 70%);animation:orb2 10s ease-in-out infinite;pointer-events:none}
    @keyframes orb1{0%,100%{transform:translate(0,0)}50%{transform:translate(30px,-20px)}}
    @keyframes orb2{0%,100%{transform:translate(0,0)}50%{transform:translate(-20px,15px)}}

    .splash{position:relative;z-index:10;text-align:center;animation:fadeUp .8s ease .2s both}
    @keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

    .logo-wrap{margin-bottom:24px}
    .logo-ring{width:80px;height:80px;margin:0 auto;border-radius:50%;padding:3px;background:conic-gradient(from 0deg,#8b5cf6,#3b82f6,#06b6d4,#22c55e,#8b5cf6);animation:logoSpin 3s linear infinite}
    @keyframes logoSpin{to{filter:hue-rotate(360deg)}}
    .logo-inner{width:100%;height:100%;background:#0a0a0c;border-radius:50%;display:flex;align-items:center;justify-content:center}
    .logo-inner svg{animation:logoPulse 2s ease-in-out infinite}
    @keyframes logoPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}

    .title{font-size:28px;font-weight:900;letter-spacing:8px;color:#fff;margin-bottom:4px;animation:fadeUp .8s ease .4s both}
    .subtitle{font-size:11px;color:#52525b;letter-spacing:3px;font-weight:500;margin-bottom:32px;animation:fadeUp .8s ease .5s both}

    .progress-area{width:280px;margin:0 auto;animation:fadeUp .8s ease .6s both}
    .status{font-size:11px;color:#71717a;margin-bottom:10px;height:16px;letter-spacing:.3px;transition:color .3s}
    .status.ok{color:#22c55e}
    .status.err{color:#ef4444}

    .bar-wrap{width:100%;height:3px;background:rgba(255,255,255,.06);border-radius:2px;overflow:hidden;margin-bottom:8px}
    .bar-fill{height:100%;width:0%;background:linear-gradient(90deg,#8b5cf6,#3b82f6,#06b6d4);border-radius:2px;transition:width .4s ease}
    .bar-fill.indeterminate{width:30%;animation:indeterminate 1.5s ease-in-out infinite}
    @keyframes indeterminate{0%{transform:translateX(-100%)}100%{transform:translateX(400%)}}

    .version{font-size:9px;color:#3f3f46;letter-spacing:1px;margin-top:18px;animation:fadeUp .8s ease .7s both}
  </style>
</head>
<body>
  <div class="bg-particles" id="particles"></div>
  <div class="glow-1"></div>
  <div class="glow-2"></div>

  <div class="splash">
    <div class="logo-wrap">
      <div class="logo-ring">
        <div class="logo-inner">
          <svg viewBox="0 0 64 64" width="36" height="36">
            <path d="M32 6L8 54h12l4-8h16l4 8h12L32 6zm0 16l7 16H25l7-16z" fill="#fff"/>
          </svg>
        </div>
      </div>
    </div>
    <div class="title">APEX</div>
    <div class="subtitle">EXECUTOR</div>
    <div class="progress-area">
      <div class="status" id="status">Initializing...</div>
      <div class="bar-wrap"><div class="bar-fill indeterminate" id="bar"></div></div>
    </div>
    <div class="version" id="ver-text">v2.0.0 — Native Build</div>
  </div>

  <script>
    // Create floating particles
    const pc = document.getElementById('particles');
    for (let i = 0; i < 30; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      p.style.left = Math.random() * 100 + '%';
      p.style.animationDuration = (4 + Math.random() * 8) + 's';
      p.style.animationDelay = (Math.random() * 6) + 's';
      p.style.width = p.style.height = (1 + Math.random() * 2) + 'px';
      pc.appendChild(p);
    }

    const status = document.getElementById('status');
    const bar = document.getElementById('bar');

    // Called from C# via ExecuteScriptAsync
    window.setBootStatus = function(text, type, progress) {
      status.textContent = text;
      status.className = 'status' + (type ? ' ' + type : '');
      if (progress >= 0) {
        bar.classList.remove('indeterminate');
        bar.style.width = progress + '%';
      }
    };
  </script>
</body>
</html>
